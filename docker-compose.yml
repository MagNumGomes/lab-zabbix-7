name: lab-zabbix-7

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -Nse "SELECT 1" | grep -qx 1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZBX_DB_PASSWORD:?Defina ZBX_DB_PASSWORD igual a MYSQL_PASSWORD}
      ZBX_CACHESIZE: 128M
      ZBX_TIMEOUT: "30"
      TZ: America/Sao_Paulo
    ports:
      - "10051:10051"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10051'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZBX_DB_PASSWORD:?Defina ZBX_DB_PASSWORD igual a MYSQL_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      ZBX_SERVER_NAME: Laboratorio Zabbix 7.0
      PHP_TZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - zabbix-net

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: unless-stopped
    hostname: docker-host
    # Root permite acessar o socket Docker independentemente do GID do host.
    user: "0:0"
    pid: host
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      ZBX_LISTENPORT: "10050"
      ZBX_TIMEOUT: "30"
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10050'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - zabbix-net

  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:ubuntu-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: lab-proxy
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PROXYMODE: "0"
      ZBX_PROXYCONFIGFREQUENCY: "10"
      TZ: America/Sao_Paulo
    volumes:
      - proxy-data:/var/lib/zabbix/db_data
    ports:
      - "10052:10051"
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10051'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - zabbix-net

  lab-files:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./mint:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/setup-mint.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zabbix-net

  linux-lab:
    build:
      context: ./linux-host
    image: lab-zabbix-7-linux:local
    restart: unless-stopped
    hostname: linux-lab
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10050'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zabbix-net

volumes:
  mysql-data:
  proxy-data:

networks:
  zabbix-net:
    name: zabbix-net
    driver: bridge
